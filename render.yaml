services:
  - type: web
    name: sales-pos
    env: node
    plan: free
    buildCommand: npm install && npm rebuild better-sqlite3 sharp
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false # Neon Postgres connection string → permanent DB (without it, SQLite is wiped on restart!)
      - key: CLOUDINARY_URL
        sync: false # cloudinary://API_KEY:API_SECRET@CLOUD_NAME → permanent product images
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads
